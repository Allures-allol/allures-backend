services:
  auth_service:
    image: denstep123/auth-service:latest
    container_name: auth_service
    restart: unless-stopped
    env_file: /home/adminden/.env
    environment:
      PYTHONPATH: /app:/app/common
      TZ: "Europe/Kyiv"
    command: uvicorn services.auth_service.main:app --host 0.0.0.0 --port 8000
    ports: ["8003:8000"]
    networks: [allures-net]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  product_service:
    image: denstep123/product-service:latest
    container_name: product_service
    restart: unless-stopped
    env_file: /home/adminden/.env
    environment:
      PYTHONPATH: /app:/app/common
      TZ: "Europe/Kyiv"
      # базовый URL review без префикса, т.к. ниже у review включаем root_path
      REVIEW_SERVICE_URL: "http://review_service:8000"
    command: uvicorn services.product_service.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on: [review_service]
    networks: [allures-net]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  review_service:
    image: denstep123/review-service:latest
    container_name: review_service
    restart: unless-stopped
    env_file: /home/adminden/.env
    environment:
      PYTHONPATH: /app:/app/common
      TZ: "Europe/Kyiv"
      REVIEW_USE_ROOT_PATH: "1"     # ← включаем root_path="/review"
    command: uvicorn services.review_service.main:app --host 0.0.0.0 --port 8000
    ports: ["8002:8000"]
    networks: [allures-net]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  subscription_service:
    image: denstep123/subscription-service:latest
    container_name: subscription_service
    restart: unless-stopped
    env_file: /home/adminden/.env
    environment:
      PYTHONPATH: /app:/app/common
      TZ: "Europe/Kyiv"
      SUBSCRIPTION_USE_ROOT_PATH: "1"
    command: uvicorn services.subscription_service.main:app --host 0.0.0.0 --port 8000
    ports: ["8011:8000"]
    networks: [allures-net]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  admin_service:
    image: denstep123/admin-service:latest
    container_name: admin_service
    restart: unless-stopped
    env_file: /home/adminden/.env
    environment:
      PYTHONPATH: /app:/app/common
      TZ: "Europe/Kyiv"
      ADMIN_USE_ROOT_PATH: "1"
      SUBSCRIPTION_SERVICE_URL: "http://subscription_service:8000"
    command: uvicorn services.admin_service.main:app --host 0.0.0.0 --port 8000
    ports: ["8010:8000"]
    depends_on: [subscription_service]
    networks: [allures-net]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  profile_service:
    image: denstep123/profile-service:latest
    container_name: profile_service
    restart: unless-stopped
    env_file: /home/adminden/.env
    environment:
      PYTHONPATH: /app:/app/common
      TZ: "Europe/Kyiv"
    command: uvicorn services.profile_service.main:app --host 0.0.0.0 --port 8000
    ports: ["8004:8000"]
    networks: [allures-net]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  payment_service:
    image: denstep123/payment-service:latest
    container_name: payment_service
    restart: unless-stopped
    env_file: /home/adminden/.env
    environment:
      PYTHONPATH: /app:/app/common
      TZ: "Europe/Kyiv"
      PAYMENT_USE_ROOT_PATH: "1"
      MAINDB_URL: "${MAINDB_URL}"
      MONOBANK_TOKEN: "${MONOBANK_TOKEN}"
      MONOBANK_REDIRECT_URL: "${MONOBANK_REDIRECT_URL}"
      MONOBANK_WEBHOOK_URL: "${MONOBANK_WEBHOOK_URL}"
    command: uvicorn services.payment_service.main:app --host 0.0.0.0 --port 8000
    ports: ["8005:8000"]
    networks: [allures-net]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  allures-net:
    external: true
